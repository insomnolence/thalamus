[project]
name = "thalamus-retrieval"
version = "0.1.0"
description = "Retrieval: Retriever protocol + baseline implementations."
requires-python = ">=3.12"
dependencies = ["thalamus-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]
