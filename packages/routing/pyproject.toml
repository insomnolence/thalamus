[project]
name = "thalamus-routing"
version = "0.1.0"
description = "Routing: embedding encoder + intent classifier."
license = "Apache-2.0"
authors = [{ name = "The Thalamus Authors" }]
requires-python = ">=3.12"
dependencies = ["thalamus-core"]

[project.optional-dependencies]
# The production semantic encoder: BGE-small via fastembed (ONNX Runtime, no torch).
# The same model is also available via sentence-transformers for parity/ablation — that path
# is intentionally NOT an extra (it would pull torch into the default install); install it
# manually with `pip install sentence-transformers` and select `--encoder bge-small-st`.
fastembed = ["fastembed>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]
