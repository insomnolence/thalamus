[project]
name = "thalamus-routing"
version = "0.1.0"
description = "Routing: embedding encoder + intent classifier."
requires-python = ">=3.12"
dependencies = ["thalamus-core"]

[project.optional-dependencies]
bge = ["sentence-transformers>=3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]
