[project]
name = "thalamus-store"
version = "0.1.0"
description = "Shared storage substrate: one graph + per-hemisphere vector indexes."
requires-python = ">=3.12"
dependencies = ["thalamus-core"]

[project.optional-dependencies]
neo4j = ["neo4j>=5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]
