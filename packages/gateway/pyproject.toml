[project]
name = "thalamus-gateway"
version = "0.1.0"
description = "Gateway: MCP conduit + context payload assembly."
license = "Apache-2.0"
authors = [{ name = "The Thalamus Authors" }]
requires-python = ">=3.12"
dependencies = ["thalamus-core", "thalamus-instrumentation", "thalamus-structural"]

[project.optional-dependencies]
mcp = ["fastmcp>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]
