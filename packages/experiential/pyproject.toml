[project]
name = "thalamus-experiential"
version = "0.1.0"
description = "Brain 1 (experiential hemisphere): episodes, the why, beliefs."
requires-python = ">=3.12"
dependencies = ["thalamus-core", "thalamus-instrumentation"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]
