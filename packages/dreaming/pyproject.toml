[project]
name = "thalamus-dreaming"
version = "0.1.0"
description = "Dreaming: the offline scheduler of gated, removable consolidation/refresh passes."
requires-python = ">=3.12"
dependencies = ["thalamus-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]
