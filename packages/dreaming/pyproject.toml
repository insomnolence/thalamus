[project]
name = "thalamus-dreaming"
version = "0.1.0"
description = "Dreaming: the offline scheduler of gated, removable consolidation/refresh passes."
requires-python = ">=3.12"
# Framework modules (base/scheduler/log) use ``core`` only; the individual passes pull the
# hemispheres they consolidate (structural staleness, the gateway refresh seam).
dependencies = ["thalamus-core", "thalamus-structural", "thalamus-gateway"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]
