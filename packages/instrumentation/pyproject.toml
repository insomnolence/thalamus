[project]
name = "thalamus-instrumentation"
version = "0.1.0"
description = "Instrumentation: logging contract + trajectory observers."
requires-python = ">=3.12"
dependencies = ["thalamus-core"]

# pytest is only needed to *run* the live-capture plugin; the package imports fine
# without it (the plugin module is loaded by pytest itself, never by the package).
[project.optional-dependencies]
pytest = ["pytest>=8.0"]

# Auto-register the live-capture plugin. It is inert unless THALAMUS_PYTEST_CAPTURE
# is set, so loading it imposes no behaviour on unrelated pytest runs.
[project.entry-points.pytest11]
thalamus_capture = "thalamus.instrumentation.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thalamus"]
